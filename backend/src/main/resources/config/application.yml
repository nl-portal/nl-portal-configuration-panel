logging:
    level:
        root: ${LOGLEVEL:INFO}
        # These log credentials or decrypted values at DEBUG or TRACE, so a root level doesn't enable them:
        # entity listing on flush, with decrypted configuration values
        org.hibernate.orm.core: INFO
        # request headers in full: the notify client's secret (Basic) and service token (Bearer)
        sun.net.www.protocol.http: INFO
        # the configuration server token (preAuthenticatedPrincipal)
        org.springframework.security.web.authentication.preauth: INFO
        # incoming requests in full at TRACE: admins' bearer tokens and X-Config-Token
        org.apache.coyote.http11: INFO

server:
    servlet:
        encoding:
            enabled: false

spring:
    application:
        name: configuration-panel-backend
    cache:
        type: simple
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.postgresql.Driver
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
        name: nl-portal-config-database
        hikari:
            auto-commit: false
            poolName: "nl-portal-config-pool"
    liquibase:
        change-log: classpath:/liquibase/config-master.xml
    jpa:
        database: postgresql
        show_sql: false
        open-in-view: false
        properties:
            hibernate:
                hbm2ddl.auto: none
                generate_statistics: false
                naming-strategy: org.springframework.boot.orm.jpa.hibernate.SpringNamingStrategy
                cache:
                    use_second_level_cache: false
                    use_query_cache: false
                    region.factory_class: org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
                format_sql: true
                jdbc:
                    time_zone: UTC
                connection:
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${JWKS_URI}
                    authority-prefix:
                    authorities-claim-expressions: ${CONFIG_SECURITY_JWT_AUTHORITIES_CLAIM_NAME:['realm_access']['roles']}

management:
    endpoint:
        health:
            access: read_only
            probes:
                enabled: true
    endpoints:
        web:
            base-path: /management
            exposure:
                include: health

configuration-panel:
    cache:
        config-ttl: ${CONFIG_CACHE_TTL}
    security:
        token: ${CONFIG_SERVER_TOKEN}
        authorities: ${CONFIG_SECURITY_API_AUTHORITIES:ROLE_CONFIG_PANEL_ADMIN}
        allowed-key-prefixes: ${CONFIG_SECURITY_ALLOWED_KEY_PREFIXES:nl-portal.config.,nl-portal.frontend.}
        cors:
            - path: "/api/v1/**"
              config:
                allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
                allowed-methods: ${CORS_ALLOWED_METHODS:GET, POST, PUT, DELETE}
                allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization, Content-Type, Accept}

    encryption:
        enabled: ${CONFIG_ENCRYPTION_ENABLED:true}
        key: ${CONFIG_ENCRYPTION_KEY:}

    notify:
        notify-on-changes: ${CONFIG_NOTIFY_ENABLED:false}
        notify-list: ${CONFIG_NOTIFY_LIST}
        connect-timeout: ${CONFIG_NOTIFY_CONNECT_TIMEOUT:5s}
        read-timeout: ${CONFIG_NOTIFY_READ_TIMEOUT:10s}
        client:
            token-uri: ${CONFIG_NOTIFY_CLIENT_TOKEN_URI:}
            client-id: ${CONFIG_NOTIFY_CLIENT_ID:}
            client-secret: ${CONFIG_NOTIFY_CLIENT_SECRET:}
            scope: ${CONFIG_NOTIFY_CLIENT_SCOPE:}
