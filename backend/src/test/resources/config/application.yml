spring:
    cloud:
        config:
          server:
              prefix: "/configuration"
    liquibase:
        enabled: false
    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:;MODE=PostgreSQL
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: http://localhost:8082
                    authority-prefix:
                    authorities-claim-expressions: "['realm_access']['roles']"
configuration-panel:
    encryption:
        # Same key as the cross-repo vector in ConfigurationValueEncryptorTest
        key: u8nzUYr3cgDzLfwQE+IWU73QbPFORBBG+hjk1XNiXuI=
    security:
        authorities: ROLE_CONFIG_PANEL_ADMIN
        allowed-key-prefixes: nl-portal.config.,nl-portal.frontend.
---

configuration-panel:
    cache:
        config-ttl: "30000"
    notify:
        notify-on-changes: true
        notify-list: "http://localhost:8080, http://localhost:8081"
        client:
            token-uri: http://localhost:1/token
            client-id: test-client
            client-secret: test-secret
    security:
        token: SecretTestToken123456
spring:
    config:
        activate:
            on-profile: "jdbc"

---

configuration-panel:
    cache:
        config-ttl: "30000"
    notify:
        notify-on-changes: false
    security:
        token: SecretTestToken123456
spring:
    config:
        activate:
            on-profile: "no-notify"


