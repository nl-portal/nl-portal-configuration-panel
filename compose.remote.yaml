# RUN_MODE=remote: the panel from the published 3.0 images, on http://localhost:3001.
services:
    localhost:
        ports:
            - "3001:8080" # Frontend
            - "8090:8090" # Backend

    configuration-panel-backend:
        image: ghcr.io/nl-portal/configuration-panel-backend:3.0
        depends_on:
            - configuration-panel-database
        network_mode: "service:localhost"
        env_file: ./imports/backend.env

    configuration-panel-frontend:
        image: ghcr.io/nl-portal/configuration-panel-frontend:3.0
        depends_on:
            - configuration-panel-backend
        network_mode: "service:localhost"
        env_file: ./imports/frontend.env
