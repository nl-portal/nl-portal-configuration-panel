name: _stage-be

on:
    workflow_call:
        inputs:
            version:
                description: "The channel-decorated version to stamp."
                type: string
                required: true
            runTests:
                description: "Run the test suite and spotless. Release sets false (the RC already passed it on this commit)."
                type: boolean
                default: true
            javaVersion:
                type: string
                default: "21"

permissions:
    contents: read

jobs:
    stage:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up JDK ${{ inputs.javaVersion }}
                uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
                with:
                    java-version: ${{ inputs.javaVersion }}
                    distribution: temurin
            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            -   name: Build + stage
                working-directory: backend
                env:
                    VERSION: ${{ inputs.version }}
                    GRADLE_TASK: ${{ inputs.runTests && 'build' || 'assemble' }}
                run: ./gradlew "${GRADLE_TASK}" -Pversion="${VERSION}" --stacktrace
            -   name: Package stage bundle
                working-directory: backend
                run: tar -cf backend-stage.tar build/libs/backend.jar
            -   name: Upload stage bundle
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: backend-stage
                    path: backend/backend-stage.tar
                    retention-days: 1
