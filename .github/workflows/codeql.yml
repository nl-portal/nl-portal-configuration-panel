name: CodeQL

on:
    pull_request:
        branches:
            - main
            - "release/*.x"
            - "rc/*"
    push:
        branches:
            - main
    schedule:
        -   cron: "0 6 * * 1"

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   language: javascript-typescript
                        build-mode: none
                    -   language: java-kotlin
                        build-mode: manual
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up JDK 21
                if: ${{ matrix.language == 'java-kotlin' }}
                uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
                with:
                    java-version: "21"
                    distribution: temurin
            -   name: Set up Gradle
                if: ${{ matrix.language == 'java-kotlin' }}
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
            -   name: Initialize CodeQL
                uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
                with:
                    languages: ${{ matrix.language }}
                    build-mode: ${{ matrix.build-mode }}
            -   name: Build backend
                if: ${{ matrix.language == 'java-kotlin' }}
                working-directory: backend
                run: ./gradlew assemble --no-daemon
            -   name: Perform CodeQL analysis
                uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
                with:
                    category: "/language:${{ matrix.language }}"
