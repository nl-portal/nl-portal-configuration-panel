name: Build and Publish Release

on:
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.v.outputs.version }}
            minor: ${{ steps.v.outputs.minor }}
            major: ${{ steps.v.outputs.major }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
            -   name: Guard branch
                run: |
                    case "${GITHUB_REF_NAME}" in
                      rc/*) : ;;
                      *) echo "::error::build-and-publish-release.yml must be dispatched from the rc/* branch being promoted (got ${GITHUB_REF_NAME})."; exit 1 ;;
                    esac
            -   name: Read release version
                id: v
                run: |
                    version=$(cat version.txt)
                    {
                      echo "version=${version}"
                      echo "minor=${version%.*}"
                      echo "major=${version%%.*}"
                    } >> "$GITHUB_OUTPUT"
                    echo "::notice::Release version ${version}"
            -   name: Pre-flight - release notes must exist
                env:
                    VERSION: ${{ steps.v.outputs.version }}
                run: |
                    notes="release-notes/${VERSION}.md"
                    if [ ! -s "${notes}" ]; then
                      echo "::error::${notes} is missing or empty. Add the release notes on the rc branch before releasing."
                      exit 1
                    fi
            -   name: Pre-flight - release line must fast-forward
                env:
                    MAJOR: ${{ steps.v.outputs.major }}
                run: |
                    branch="release/${MAJOR}.x"
                    tip=$(git ls-remote --heads origin "${branch}" | cut -f1)
                    if [ -z "${tip}" ]; then
                      echo "::notice::${branch} does not exist yet - it will be born from ${GITHUB_SHA}."
                      exit 0
                    fi
                    git fetch origin "${branch}"
                    if git merge-base --is-ancestor "${tip}" "${GITHUB_SHA}"; then
                      echo "::notice::${branch} (${tip}) fast-forwards to ${GITHUB_SHA}."
                    else
                      echo "::error::${branch} tip ${tip} is not an ancestor of the rc commit ${GITHUB_SHA}; the line cannot fast-forward. Resolve before releasing."
                      exit 1
                    fi

    stage-be:
        needs: prepare
        uses: ./.github/workflows/_stage-be.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
            runTests: false

    stage-fe:
        needs: prepare
        uses: ./.github/workflows/_stage-fe.yml
        with:
            version: ${{ needs.prepare.outputs.version }}

    gate:
        needs: [prepare, stage-be, stage-fe]
        runs-on: ubuntu-latest
        environment: release
        steps:
            -   name: Approved
                env:
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: echo "::notice::Release ${VERSION} approved - proceeding to publish."

    image-be:
        needs: [prepare, stage-be, gate]
        permissions:
            contents: read
            packages: write
            id-token: write
        uses: ./.github/workflows/_build-app-image.yml
        with:
            stack: backend
            push: true
            primaryTag: ghcr.io/nl-portal/configuration-panel-backend:${{ needs.prepare.outputs.version }}
            tags: |
                ghcr.io/nl-portal/configuration-panel-backend:${{ needs.prepare.outputs.version }}
                ghcr.io/nl-portal/configuration-panel-backend:${{ needs.prepare.outputs.minor }}
                ghcr.io/nl-portal/configuration-panel-backend:${{ needs.prepare.outputs.major }}
        secrets: inherit

    image-fe:
        needs: [prepare, stage-fe, gate]
        permissions:
            contents: read
            packages: write
            id-token: write
        uses: ./.github/workflows/_build-app-image.yml
        with:
            stack: frontend
            push: true
            primaryTag: ghcr.io/nl-portal/configuration-panel-frontend:${{ needs.prepare.outputs.version }}
            tags: |
                ghcr.io/nl-portal/configuration-panel-frontend:${{ needs.prepare.outputs.version }}
                ghcr.io/nl-portal/configuration-panel-frontend:${{ needs.prepare.outputs.minor }}
                ghcr.io/nl-portal/configuration-panel-frontend:${{ needs.prepare.outputs.major }}
        secrets: inherit

    create-release:
        needs: [prepare, image-be, image-fe]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Generate GitHub App token
                id: token
                uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
                with:
                    client-id: ${{ secrets.NL_PORTAL_APP_CLIENT_ID }}
                    private-key: ${{ secrets.NL_PORTAL_APP_PRIVATE_KEY }}
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    token: ${{ steps.token.outputs.token }}
                    fetch-depth: 0
            -   name: Advance or birth the release/<major>.x line
                env:
                    MAJOR: ${{ needs.prepare.outputs.major }}
                run: |
                    branch="release/${MAJOR}.x"
                    git push origin "${GITHUB_SHA}:refs/heads/${branch}"
                    echo "::notice::${branch} now at ${GITHUB_SHA}."
            -   name: Tag the release commit
                env:
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null 2>&1; then
                      echo "::notice::Tag ${VERSION} already exists - skipping."
                    else
                      git tag "${VERSION}" "${GITHUB_SHA}"
                      git push origin "refs/tags/${VERSION}"
                    fi
            -   name: Create the GitHub release
                env:
                    GH_TOKEN: ${{ steps.token.outputs.token }}
                    VERSION: ${{ needs.prepare.outputs.version }}
                run: |
                    if gh release view "${VERSION}" > /dev/null 2>&1; then
                      echo "::notice::Release ${VERSION} already exists - skipping."
                    else
                      gh release create "${VERSION}" --title "${VERSION}" --notes-file "release-notes/${VERSION}.md" --generate-notes
                    fi
            -   name: Delete the release candidate branch
                env:
                    RC_BRANCH: ${{ github.ref_name }}
                run: |
                    if git ls-remote --exit-code --heads origin "${RC_BRANCH}" > /dev/null 2>&1; then
                      echo "::notice::Deleting ${RC_BRANCH}."
                      git push origin --delete "${RC_BRANCH}"
                    else
                      echo "::notice::${RC_BRANCH} already gone - skipping."
                    fi
