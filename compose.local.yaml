# RUN_MODE=local: the panel built from this checkout, on http://localhost:3001.
services:
    localhost:
        ports:
            - "3001:8080" # Frontend
            - "8090:8090" # Backend

    configuration-panel-backend:
        build: backend/
        depends_on:
            - configuration-panel-database
        network_mode: "service:localhost"
        env_file: ./imports/backend.env

    configuration-panel-frontend:
        build: frontend/
        depends_on:
            - configuration-panel-backend
        network_mode: "service:localhost"
        env_file: ./imports/frontend.env
