# Run mode (RUN_MODE): sources (default) | local | remote
#   sources: only the database and Keycloak; run `./gradlew bootRun` (8090) and `pnpm dev` (3001) yourself.
#   local:   also the panel, built from this checkout, behind a router on 3001.
#   remote:  also the panel, from the published 3.0 images, behind a router on 3001.
# Example: RUN_MODE=local docker compose up -d --build
name: nl-portal-configuration-panel

include:
    - path: "compose.${RUN_MODE:-sources}.yaml"

services:
    configuration-panel-database:
        image: postgres:15
        environment:
            POSTGRES_USER: config
            POSTGRES_PASSWORD: password
            POSTGRES_DB: nl-portal-config
        ports:
            - "54322:5432"
        volumes:
            - configuration-panel-database-data:/var/lib/postgresql/data # persist data even if container shuts down

    keycloak:
        depends_on:
            - keycloak-database
        image: quay.io/keycloak/keycloak:26.8
        ports:
            - "127.0.0.1:8083:8080"
        environment:
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://keycloak-database/keycloak
            KC_DB_USERNAME: keycloak
            KC_DB_PASSWORD: keycloak
            KC_HTTP_RELATIVE_PATH: /auth
        volumes:
            - ./imports/keycloak:/opt/keycloak/data/import
        command: "start-dev --import-realm"

    keycloak-database:
        image: postgres:15
        environment:
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: keycloak

volumes:
    configuration-panel-database-data:
